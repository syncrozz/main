<!doctype html>
<html lang="ms" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SYNCROZZ — Smart Solutions for Education, Productivity & Digital Innovation</title>
    <meta name="description" content="Platform pintar yang membantu pendidik, institusi, komuniti dan organisasi bekerja dengan lebih cekap, teratur dan berkesan melalui inovasi digital." />
    <meta name="theme-color" content="#0056D2" />
    
    <!-- SYNCROZZ Official Logo & Favicon Assets (MAIN folder) -->
    <!-- 12. Modern Scalable Vector Favicon -->
    <link rel="icon" type="image/svg+xml" href="https://raw.githubusercontent.com/syncrozz/syncrozz-assets/main/logo/MAIN/favicon.svg" />
    <!-- 13. Legacy ICO Fallback Favicon -->
    <link rel="icon" type="image/x-icon" href="https://raw.githubusercontent.com/syncrozz/syncrozz-assets/main/logo/MAIN/favicon.ico" />
    <!-- 4. Favicon 16x16 -->
    <link rel="icon" type="image/png" sizes="16x16" href="https://raw.githubusercontent.com/syncrozz/syncrozz-assets/main/logo/MAIN/favicon-16x16.png" />
    <!-- 5. Favicon 32x32 -->
    <link rel="icon" type="image/png" sizes="32x32" href="https://raw.githubusercontent.com/syncrozz/syncrozz-assets/main/logo/MAIN/favicon-32x32.png" />
    <!-- 6. Favicon 48x48 -->
    <link rel="icon" type="image/png" sizes="48x48" href="https://raw.githubusercontent.com/syncrozz/syncrozz-assets/main/logo/MAIN/favicon-48x48.png" />
    <!-- 7. Favicon 96x96 -->
    <link rel="icon" type="image/png" sizes="96x96" href="https://raw.githubusercontent.com/syncrozz/syncrozz-assets/main/logo/MAIN/favicon-96x96.png" />
    
    <!-- 3. Apple Touch Icon for iOS -->
    <link rel="apple-touch-icon" sizes="180x180" href="https://raw.githubusercontent.com/syncrozz/syncrozz-assets/main/logo/MAIN/apple-touch-icon.png" />
    
    <!-- 9. PWA Web App Manifest -->
    <link rel="manifest" href="https://raw.githubusercontent.com/syncrozz/syncrozz-assets/main/logo/MAIN/site.webmanifest" />
    
    <!-- 8. Microsoft Windows Tile Configuration -->
    <meta name="msapplication-TileColor" content="#0056D2" />
    <meta name="msapplication-TileImage" content="https://raw.githubusercontent.com/syncrozz/syncrozz-assets/main/logo/MAIN/mstile-150x150.png" />
    
    <!-- Open Graph (OGI) & Social Media Preview (1200 x 630 px) -->
    <meta property="og:title" content="SYNCROZZ — Smart Solutions for Education & Innovation" />
    <meta property="og:description" content="Ekosistem penyelesaian digital praktikal untuk pendidikan, produktiviti dan inovasi." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://syncrozz.com" />
    <meta property="og:image" content="https://raw.githubusercontent.com/syncrozz/syncrozz-assets/main/OGI/OGI.MAINv2.jpg" />
    <meta property="og:image:secure_url" content="https://raw.githubusercontent.com/syncrozz/syncrozz-assets/main/OGI/OGI.MAINv2.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SYNCROZZ — Smart Solutions for Education & Innovation (Official Open Graph Image)" />
    
    <!-- Twitter Summary Card with Large Image -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SYNCROZZ — Smart Solutions for Education & Innovation" />
    <meta name="twitter:description" content="Ekosistem penyelesaian digital praktikal untuk pendidikan, produktiviti dan inovasi." />
